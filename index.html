<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AiresCare - Mantenimiento de Aires Acondicionados</title>
<meta name="description" content="Recordatorios y control de mantenimiento para tus aires acondicionados." />
<link rel="manifest" href="manifest.json" />
<script>
  try{
    var t = localStorage.getItem("airescare_theme_v1");
    if(t === "dark") document.documentElement.setAttribute("data-theme","dark");
  }catch(e){}
</script>
<meta name="theme-color" content="var(--primary)" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AiresCare" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EAF2F8;
    --app-bg:#F3F8FC;
    --card:#FFFFFF;
    --ink:#0B2A45;
    --ink-soft:#5B7A93;
    --primary:#0E63B0;
    --primary-deep:#083A66;
    --accent:#37B6C4;
    --mint:#28A88B;
    --line:#DCEAF3;
    --chip-bg:#E7F3FC;
    --warn:#E8A33D;
  }
  [data-theme="dark"]{
    --bg:#0B1622;
    --app-bg:#0F1B29;
    --card:#162435;
    --ink:#EAF2F8;
    --ink-soft:#8CA3B8;
    --primary:#3B9CF0;
    --primary-deep:#0E63B0;
    --accent:#4FD1E0;
    --mint:#34D1A6;
    --line:#233448;
    --chip-bg:#1B2C40;
    --warn:#F0B559;
  }
  [data-theme="dark"] body{ background:var(--bg); }
  [data-theme="dark"] .install-banner{ background:#0B1622; }
  [data-theme="dark"] img[src="ac-unit.png"],
  [data-theme="dark"] img[src="ac-hero.png"]{
    filter: invert(0.9) hue-rotate(180deg);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter', system-ui, sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  #shell{ display:flex; min-height:100vh; min-height:100dvh; }
  #sidebar{ display:none; }
  #mobileTopbar{
    position:fixed; top:0; left:0; right:0; z-index:50;
    max-width:480px; margin:0 auto;
    background:var(--card); border:none; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding: calc(env(safe-area-inset-top,10px) + 10px) 16px 10px;
  }
  #mobileTopbarHome{
    background:none; border:none; display:flex; align-items:center; gap:8px;
    padding:0; margin:0; cursor:pointer; text-align:left;
  }
  #mobileTopbarHome img{ border-radius:7px; display:block; }
  #mobileTopbarHome span{ font-weight:800; font-size:15px; color:var(--primary-deep); }
  #mobileTopbarRight{ display:flex; align-items:center; gap:12px; flex-shrink:0; }
  #mobileTopbarBell{
    background:none; border:none; display:flex; align-items:center; justify-content:center;
    padding:0; margin:0; cursor:pointer; color:var(--ink);
  }
  #mobileTopbarProfile{
    background:var(--chip-bg); border:none; border-radius:999px;
    width:32px; height:32px; display:flex; align-items:center; justify-content:center;
    padding:0; margin:0; flex-shrink:0; color:var(--ink-soft); overflow:hidden;
  }
  #mobileTopbarProfile.active{ background:var(--chip-bg); color:var(--primary); }
  #mobileTopbarBellBadge, #desktopTopbarBellBadge{
    position:absolute; top:-2px; right:-2px; background:#D64545; color:#fff;
    font-size:10px; font-weight:800; min-width:16px; height:16px; border-radius:999px;
    align-items:center; justify-content:center; padding:0 3px;
  }
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    background:var(--app-bg);
    display:flex;
    flex-direction:column;
    position:relative;
    flex:1;
    padding-top: calc(46px + env(safe-area-inset-top,10px));
  }

  /* ---------- Diseño de escritorio ---------- */
  @media (min-width: 900px){
    body{ background:var(--bg); }
    #shell{ max-width:1180px; margin:0 auto; }
    #sidebar{
      display:flex; flex-direction:column; width:240px; flex-shrink:0;
      padding:28px 16px; gap:6px; background:var(--card); border-right:1px solid var(--line);
      min-height:100vh; position:sticky; top:0; height:100vh; overflow-y:auto; align-self:flex-start;
    }
    .sidebar-logo{
      display:flex; align-items:center; gap:10px; padding:0 10px 22px;
      font-weight:800; font-size:16.5px; color:var(--primary-deep);
    }
    .sidebar-logo-icon{
      width:30px; height:30px; border-radius:9px; background:var(--primary);
      display:flex; align-items:center; justify-content:center; flex-shrink:0;
    }
    .sidebar-cta{
      background:var(--primary); color:#fff; border:none; border-radius:12px;
      padding:11px 14px; font-weight:700; font-size:13.5px; margin:0 2px 18px;
      cursor:pointer; text-align:center;
    }
    .sidebar-nav{ display:flex; flex-direction:column; gap:2px; }
    .sidebar-link{
      display:flex; align-items:center; gap:12px; background:none; border:none;
      padding:11px 12px; border-radius:10px; font-size:14px; font-weight:600;
      color:var(--ink-soft); text-align:left; cursor:pointer;
    }
    .sidebar-link .sb-icon{ display:flex; }
    .sidebar-link:hover{ background:var(--chip-bg); color:var(--primary); }
    .sidebar-link.active{ background:var(--chip-bg); color:var(--primary); }

    #app{
      max-width:none;
      width:auto;
      flex:1;
      min-height:100vh;
      box-shadow:none;
      border:none;
      border-radius:0;
      padding-top:64px;
    }
    #mobileTopbar{ display:none; }
    .screen{ max-width:900px; margin:0 auto; width:100%; }
    .scroll{ padding-left:40px; padding-right:40px; padding-bottom:60px; }
    .topbar{ padding-left:40px; padding-right:40px; max-width:900px; margin:0 auto; width:100%; box-sizing:border-box; }
    .bottomnav{ display:none !important; }

    /* Cuadricula para listas de tarjetas en vez de una sola columna */
    .grid-cards{
      display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:14px;
    }
    .grid-cards .equipo-row{ margin-bottom:0; }
    .grid-cards .card{ margin-bottom:0; height:100%; }
  }
  button, select, textarea, input{ font-family:inherit; }
  button{ cursor:pointer; }
  .screen{ display:flex; flex-direction:column; flex:1; min-height:0; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 14px;
  }
  .topbar .title{ font-weight:700; font-size:17px; color:var(--ink); }
  .iconbtn{ background:none; border:none; padding:6px; margin:-6px; display:flex; }
  #desktopTopbarRight{ display:none; }
  .topbar-avatar{
    display:none; width:34px; height:34px; border-radius:999px; background:var(--chip-bg);
    align-items:center; justify-content:center; border:none; cursor:pointer; flex-shrink:0; padding:0; overflow:hidden;
  }
  @media (min-width: 900px){
    .topbar-avatar{ display:flex; }
    #desktopTopbarRight{
      display:flex; align-items:center; gap:10px; z-index:60;
      position:fixed; top:20px; right:max(40px, calc((100vw - 1180px)/2 + 40px));
    }
  }
  .scroll{ flex:1; overflow-y:auto; padding:0 20px calc(84px + env(safe-area-inset-bottom,0px)); -webkit-overflow-scrolling:touch; }
  .bottomnav{
    display:grid; grid-template-columns:repeat(5,1fr); align-items:center; justify-items:center;
    padding:8px 4px calc(env(safe-area-inset-bottom,14px) + 8px);
    border-top:1px solid var(--line); background:var(--card);
    position:fixed; left:0; right:0; bottom:0;
    max-width:480px; margin:0 auto;
    z-index:40;
  }
  .navbtn{ background:none; border:none; display:flex; flex-direction:column; gap:2px; align-items:center; justify-content:center; color:var(--ink-soft); font-size:9px; font-weight:600; height:40px; width:100%; }
  .navbtn.active, .navbtn.active svg{ color:var(--primary); }
  .navbtn-add{ background:var(--primary); border-radius:999px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(14,99,176,0.35); border:none; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; }
  .btn-primary{
    width:100%; background:var(--primary); color:#fff; border:none; border-radius:12px;
    padding:13px 0; font-weight:700; font-size:14px;
  }
  .btn-outline{
    width:100%; background:var(--card); color:var(--primary); border:1.5px solid var(--primary);
    border-radius:12px; padding:13px 0; font-weight:700; font-size:14px;
  }
  .field-label{ font-size:12.5px; font-weight:700; color:var(--ink-soft); display:block; margin-top:14px; }
  .field-input{
    width:100%; border:1px solid var(--line); border-radius:12px; padding:11px 12px;
    font-size:13.5px; color:var(--ink); background:var(--card); margin-top:6px;
  }
  .map-picker{
    width:100%; height:220px; border-radius:12px; margin-top:8px;
    border:1px solid var(--line); overflow:hidden;
  }
  .map-picker .leaflet-control-attribution{ font-size:9px; }
  .map-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; }
  .chip{
    display:inline-block; background:var(--chip-bg); color:var(--primary);
    font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px;
  }
  .chip-warn{ background:#FBE9D2; color:#B4700C; }
  [data-theme="dark"] .chip-warn{ background:#3A2A10; color:#F0B559; }
  [data-theme="dark"] #mobileTopbarBell svg,
  [data-theme="dark"] #desktopTopbarBell svg{ stroke:var(--ink); }
  .toggle-switch{
    position:relative; display:inline-block; width:44px; height:26px; flex-shrink:0;
  }
  .toggle-switch input{ opacity:0; width:0; height:0; }
  .toggle-slider{
    position:absolute; cursor:pointer; inset:0; background:var(--line);
    border-radius:999px; transition:.2s;
  }
  .toggle-slider:before{
    position:absolute; content:""; height:20px; width:20px; left:3px; bottom:3px;
    background:#fff; border-radius:50%; transition:.2s;
  }
  .toggle-switch input:checked + .toggle-slider{ background:var(--primary); }
  .toggle-switch input:checked + .toggle-slider:before{ transform:translateX(18px); }
  .equipo-icon{
    width:76px; height:76px; border-radius:16px; background:var(--chip-bg);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  a.equipo-row{ text-decoration:none; color:inherit; }
  .toast{
    position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
    background:var(--primary-deep); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:13px; font-weight:600; opacity:0; transition:opacity .25s; pointer-events:none;
    z-index:50; max-width:90%;
  }
  .toast.show{ opacity:1; }
  ::-webkit-scrollbar{ width:0; }

  .install-banner{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto;
    background:var(--primary-deep); color:#fff; padding:12px 16px; display:none;
    align-items:center; justify-content:space-between; gap:10px; z-index:60;
    font-size:13px;
  }
  .install-banner button{
    background:#fff; color:var(--primary-deep); border:none; border-radius:8px;
    padding:8px 14px; font-weight:700; font-size:13px; flex-shrink:0;
  }

  .confirm-overlay{
    position:fixed; inset:0; background:rgba(11,42,69,0.45);
    display:none; align-items:center; justify-content:center;
    z-index:100; padding:24px;
  }
  .confirm-overlay.show{ display:flex; }
  .confirm-box{
    background:var(--card); border-radius:18px; padding:22px 20px; max-width:340px; width:100%;
    box-shadow:0 20px 40px rgba(11,42,69,0.25);
  }
  .confirm-box p{ margin:0 0 20px; font-size:14px; color:var(--ink); line-height:1.5; }
  .confirm-actions{ display:flex; gap:10px; justify-content:flex-end; }
  .confirm-actions button{
    border:none; border-radius:10px; padding:10px 16px; font-weight:700; font-size:13.5px;
  }
  .confirm-cancel{ background:var(--chip-bg); color:var(--ink); }
  .confirm-accept{ background:#D64545; color:#fff; }
</style>
</head>
<body>
<div id="mobileTopbar">
  <button id="mobileTopbarHome" onclick="go('home')">
    <img id="mobileTopbarLogoImg" src="icon-192.png" width="24" height="24" alt="" style="border-radius:7px; object-fit:cover;" />
    <span id="mobileTopbarNombre">AiresCare</span>
  </button>
  <div id="mobileTopbarRight">
    <button id="mobileTopbarBell" onclick="go('notificaciones')" style="position:relative;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span id="mobileTopbarBellBadge" style="display:none;"></span></button>
    <button id="mobileTopbarProfile" onclick="go('perfil')"></button>
  </div>
</div>
<div id="desktopTopbarRight">
  <button id="desktopTopbarBell" class="iconbtn" onclick="go('notificaciones')" style="position:relative;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span id="desktopTopbarBellBadge" style="display:none;"></span></button>
  <button id="desktopTopbarAvatar" class="topbar-avatar" onclick="go('perfil')"></button>
</div>
<div id="shell">
  <nav id="sidebar">
    <button class="sidebar-logo" onclick="go('home')" style="border:none; background:none; cursor:pointer; text-align:left; width:100%;">
      <div class="sidebar-logo-icon">
        <img id="sidebarLogoImg" src="icon-192.png" width="30" height="30" style="border-radius:9px; display:block; object-fit:cover;" alt="" />
      </div>
      <span id="sidebarLogoNombre">AiresCare</span>
    </button>
    <button class="sidebar-cta" onclick="go('agregarEquipo')">+ Registrar equipo</button>
    <div class="sidebar-nav">
      <button class="sidebar-link" data-screen="home" onclick="go('home')"><span class="sb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg></span>Inicio</button>
      <button class="sidebar-link" data-screen="equipos" onclick="go('equipos')"><span class="sb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h11a3 3 0 1 0-3-3"/><path d="M2 13h15a3 3 0 1 1-3 3"/><path d="M4 18h9a2.5 2.5 0 1 0-2.5-2.5"/></svg></span>Mis Equipos</button>
      <button class="sidebar-link" data-screen="agenda" onclick="go('agenda')"><span class="sb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="M8 14h.01M12 14h.01M16 14h.01M8 17h.01M12 17h.01"/></svg></span>Agenda</button>
      <button class="sidebar-link" data-screen="historial" onclick="go('historial')"><span class="sb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></span>Historial</button>
      <button class="sidebar-link" data-screen="consejos" onclick="go('consejos')"><span class="sb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 4 13c0-6 6-11 16-11-1 9-6 16-11 18z"/><path d="M4 20 15 9"/></svg></span>Consejos</button>
      <button class="sidebar-link" data-screen="perfil" onclick="go('perfil')"><span class="sb-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></span>Perfil</button>
    </div>
  </nav>
  <div id="app"></div>
</div>
<div class="toast" id="toast"></div>
<div class="install-banner" id="installBanner">
  <span>Instala AiresCare en tu pantalla de inicio</span>
  <button id="installBtn">Instalar</button>
</div>
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMessage"></p>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="confirmCancelBtn">Cancelar</button>
      <button class="confirm-accept" id="confirmAcceptBtn">Eliminar</button>
    </div>
  </div>
</div>

<script>
/* ---------- Iconos SVG mínimos (sin dependencias externas) ---------- */
const ICON = {
  home: `<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/>`,
  wind: `<path d="M4 8h11a3 3 0 1 0-3-3"/><path d="M2 13h15a3 3 0 1 1-3 3"/><path d="M4 18h9a2.5 2.5 0 1 0-2.5-2.5"/>`,
  ac: `<rect x="2.5" y="6" width="19" height="7" rx="2"/><line x1="5.5" y1="9.5" x2="18.5" y2="9.5"/><circle cx="17" cy="7.7" r="0.6" fill="currentColor" stroke="none"/><path d="M6 15.5c1.2 1.2 2.2-1 3.4 0s2.2 1.2 3.4 0 2.2-1.2 3.4 0"/><path d="M6.8 18.5c1.2 1.2 2.2-1 3.4 0s2.2 1.2 3.4 0 2.2-1.2 3.4 0"/>`,
  plus: `<path d="M12 5v14M5 12h14"/>`,
  clock: `<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>`,
  bell: `<path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 21a2 2 0 0 0 4 0"/>`,
  chevronLeft: `<path d="M15 18l-6-6 6-6"/>`,
  chevronRight: `<path d="M9 18l6-6-6-6"/>`,
  snowflake: `<path d="M12 2v20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1"/><path d="M12 2l-2 2M12 2l2 2M12 22l-2-2M12 22l2-2M4.9 4.9l2.8.7M4.9 4.9l.7-2.8M19.1 4.9l-2.8.7M19.1 4.9l-.7-2.8M4.9 19.1l2.8-.7M4.9 19.1l.7 2.8M19.1 19.1l-2.8-.7M19.1 19.1l-.7 2.8"/>`,
  calendar: `<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>`,
  check: `<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>`,
  filter: `<path d="M4 5h16l-6 8v5l-4 2v-7z"/>`,
  edit: `<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>`,
  thermo: `<path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z"/>`,
  leaf: `<path d="M11 20A7 7 0 0 1 4 13c0-6 6-11 16-11-1 9-6 16-11 18z"/><path d="M4 20 15 9"/>`,
  wrench: `<path d="M14.7 6.3a4 4 0 1 1-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 1 5.4-5.4L21 6l-3-3z"/>`,
  user: `<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>`,
  trash: `<path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6M14 11v6"/>`,

const STORAGE_KEY = "airescare_equipos_v2";
function loadEquipos(){
  let equipos;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    equipos = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_EQUIPOS));
  }catch(e){
    equipos = JSON.parse(JSON.stringify(DEFAULT_EQUIPOS));
  }
  // Migracion: asegurar que cada entrada de historial tenga un id unico
  // y un estado realizado/pendiente (fechas pasadas = ya hecho, hoy/futuro = pendiente)
  let changed = false;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  equipos.forEach(eq=>{
    (eq.historial||[]).forEach(h=>{
      if(!h.id){ h.id = Date.now()+Math.random().toString(36).slice(2,7); changed = true; }
      if(h.realizado===undefined){
        const [d,m,y] = h.fecha.split("/").map(Number);
        h.realizado = new Date(y,m-1,d) < hoy;
        changed = true;
      }
    });
  });
  if(changed) saveEquipos(equipos);
  return equipos;
}
function saveEquipos(equipos, subirNube){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(equipos)); }catch(e){}
  if(subirNube !== false) programarSubidaNube();
}

      estadoSync = "ok";
      ultimaSyncFecha = new Date();
      necesitaOnboarding = !state.perfil.onboardingCompletado;
      render();

      // Primera vez de este usuario: sube lo que ya tenga localmente en este dispositivo
      necesitaOnboarding = !state.perfil.onboardingCompletado;
      await subirANube();
    }
  }catch(e){

function fechaISOaDMY(iso){
  const [y,m,d] = iso.split("-");
  return `${d}/${m}/${y}`;
}
function fechaDMYaISO(dmy){
  if(!dmy || dmy.indexOf("/")===-1) return "";
  const [d,m,y] = dmy.split("/");
  return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
}
function parseDMY(str){
  const [d,m,y] = str.split("/").map(Number);
  return new Date(y, m-1, d);
}
function diasRestantes(fechaStr){
  if(!fechaStr) return null;
  const target = parseDMY(fechaStr);
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = Math.ceil((target - today) / 86400000);
  return diff;
}
function fechaLarga(str){
  if(!str) return "Sin programar";
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const d = parseDMY(str);
  return `${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}`;
}

/* ---------- Consumo eléctrico estimado ---------- */
function parseBTU(capacidadStr){
  if(!capacidadStr) return null;
  const match = String(capacidadStr).replace(/,/g,"").match(/(\d+(\.\d+)?)/);
  if(!match) return null;
  const num = Number(match[1]);
  return num > 0 ? num : null;
}
function esInverter(eq){
  if(eq.tipoCompresor) return eq.tipoCompresor === "inverter";
  return /inverter/i.test(`${eq.marca||""} ${eq.capacidad||""}`);
}
function estimarConsumo(eq){
  const btu = parseBTU(eq.capacidad);
  if(!btu) return null;
  if(eq.horasUso==null || eq.horasUso==="") return null;
  const horas = Number(eq.horasUso);
  if(!horas || horas<=0) return null;
  // Regla práctica: watts ≈ BTU / 10 (EER promedio de referencia) para convencional.
  // Un equipo Inverter modula el compresor y consume, en promedio, ~35% menos.
  const inverter = esInverter(eq);
  const watts = (btu / 10) * (inverter ? 0.65 : 1);
  const kwhDia = (watts * horas) / 1000;
  const kwhMes = kwhDia * 30;
  return { watts, horas, kwhDia, kwhMes, inverter };
}

/* ---------- Filtro de aire ---------- */
const FILTRO_FRECUENCIA_DIAS = 14;
function diasDesdeFiltro(eq){
  if(!eq.filtroLimpio) return null;
  const target = parseDMY(eq.filtroLimpio);
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.floor((today - target) / 86400000);
}
function estadoFiltro(eq){
  const dias = diasDesdeFiltro(eq);
  if(dias === null) return { estado:"sinDato", dias:null };
  if(dias >= FILTRO_FRECUENCIA_DIAS) return { estado:"sucio", dias };
  if(dias >= FILTRO_FRECUENCIA_DIAS - 3) return { estado:"porVencer", dias };
  return { estado:"limpio", dias };
}

/* ---------- Imágenes: leer, redimensionar y comprimir (para perfil/negocio) ---------- */
function resizeImage(file, maxSize){
  maxSize = maxSize || 500;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxSize){ height = height * maxSize / width; width = maxSize; }
        else if(height > maxSize){ width = width * maxSize / height; height = maxSize; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.82));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function manejarFotoInput(inputEl, maxSize, callback){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  resizeImage(file, maxSize).then(callback).catch(()=>showToast("No se pudo cargar la imagen"));
  inputEl.value = "";
}

/* ---------- Selector de ubicación en el mapa (Leaflet) ---------- */
const MAPA_DEFAULT = { lat: -2.170998, lng: -79.922359 }; // Guayaquil, EC (referencia por defecto)
let mapPicker = { map: null, marker: null, prefix: null };

function initMapPickerIfNeeded(){
  // Limpiar instancia anterior si ya no corresponde a la pantalla actual
  if(mapPicker.map){
    mapPicker.map.remove();
    mapPicker = { map: null, marker: null, prefix: null };
  }
  if(typeof L === "undefined") return;

  if(state.screen === "agregarEquipo"){
    crearMapPicker("ne", MAPA_DEFAULT.lat, MAPA_DEFAULT.lng, false);
  } else if(state.screen === "editarEquipo"){
    const eq = state.equipos.find(e=>e.id===state.equipoSelId);
    const yaTieneUbicacion = !!(eq && eq.lat && eq.lng);
    const lat = yaTieneUbicacion ? eq.lat : MAPA_DEFAULT.lat;
    const lng = yaTieneUbicacion ? eq.lng : MAPA_DEFAULT.lng;
    crearMapPicker("ee", lat, lng, yaTieneUbicacion);
  }
}

function crearMapPicker(prefix, lat, lng, yaTocado){
  const el = document.getElementById(`map-picker-${prefix}`);
  if(!el) return;
  const map = L.map(el, { attributionControl: true }).setView([lat, lng], 15);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  const marker = L.marker([lat, lng], { draggable: true }).addTo(map);
  map.on("click", (e)=>{ marker.setLatLng(e.latlng); mapPicker.touched = true; });
  marker.on("dragend", ()=>{ mapPicker.touched = true; });
  mapPicker = { map, marker, prefix, touched: !!yaTocado };
  // Leaflet necesita recalcular tamaño si el contenedor no tenia dimension al crear el mapa
  setTimeout(()=>map.invalidateSize(), 150);
}

function usarUbicacionActual(prefix){
  if(!navigator.geolocation){
    showToast("Tu navegador no soporta geolocalización");
    return;
  }
  showToast("Buscando tu ubicación...");
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      const { latitude, longitude } = pos.coords;
      if(mapPicker.map && mapPicker.prefix===prefix){
        mapPicker.map.setView([latitude, longitude], 16);
        mapPicker.marker.setLatLng([latitude, longitude]);
        mapPicker.touched = true;
      }
      showToast("Ubicación encontrada, ajusta el pin si hace falta");
    },
    ()=>{ showToast("No se pudo obtener tu ubicación"); },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

function obtenerCoordenadasPicker(){
  if(mapPicker.map && mapPicker.marker && mapPicker.touched){
    const ll = mapPicker.marker.getLatLng();
    return { lat: ll.lat, lng: ll.lng };
  }
  return null;
}

function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}

function showConfirm(message, onAccept, acceptLabel, acceptStyle){
  const overlay = document.getElementById("confirmOverlay");
  document.getElementById("confirmMessage").textContent = message;
  overlay.classList.add("show");

  const acceptBtn = document.getElementById("confirmAcceptBtn");
  const cancelBtn = document.getElementById("confirmCancelBtn");
  acceptBtn.textContent = acceptLabel || "Eliminar";
  acceptBtn.style.background = acceptStyle === "primary" ? "var(--primary)" : "#D64545";

  const cleanup = () => {
    overlay.classList.remove("show");
    acceptBtn.onclick = null;
    cancelBtn.onclick = null;
  };
  acceptBtn.onclick = () => { cleanup(); onAccept(); };
  cancelBtn.onclick = () => { cleanup(); };
}

function go(screen, replace){
  state.screen = screen;

    cargarNotificaciones().then(()=>marcarNotificacionesLeidas());

}

async function cargarNotificaciones(){
  if(!db || !state.usuario) return;
  try{
    const snap = await db.collection("usuarios").doc(state.usuario.uid).collection("notificaciones")
      .orderBy("creada", "desc").limit(50).get();
    state.notificaciones = snap.docs.map(d=>({ id:d.id, ...d.data() })).filter(n=>!n.eliminada);
    state.notifNoLeidas = state.notificaciones.filter(n=>!n.leida).length;
    if(state.screen === "home" || state.screen === "notificaciones") render();
  }catch(e){
    console.error("No se pudieron cargar las notificaciones:", e);
  }
}

async function eliminarNotificacion(id){
  if(!db || !state.usuario) return;
  const eraNoLeida = (state.notificaciones||[]).some(n=>n.id===id && !n.leida);
  state.notificaciones = (state.notificaciones||[]).filter(n=>n.id!==id);
  if(eraNoLeida) state.notifNoLeidas = Math.max(0,(state.notifNoLeidas||0)-1);
  render();
  try{
    // Se marca como eliminada (no se borra de verdad) para que el robot de
    // GitHub Actions no la vuelva a mandar pensando que nunca se envió.
    await db.collection("usuarios").doc(state.usuario.uid).collection("notificaciones").doc(id).update({ eliminada: true, leida: true });
  }catch(e){
    console.error("No se pudo eliminar la notificación:", e);
  }
}

async function marcarNotificacionesLeidas(){
  if(!db || !state.usuario) return;
  const pendientes = (state.notificaciones||[]).filter(n=>!n.leida);
  if(pendientes.length === 0) return;
  state.notificaciones.forEach(n=>n.leida = true);
  state.notifNoLeidas = 0;
  render();
  try{
    const batch = db.batch();
    pendientes.forEach(n=>{
      batch.update(db.collection("usuarios").doc(state.usuario.uid).collection("notificaciones").doc(n.id), { leida: true });
    });
    await batch.commit();
  }catch(e){
    console.error("No se pudo marcar como leídas:", e);
  }
}

function tiempoRelativo(timestamp){
  if(!timestamp || !timestamp.toDate) return "";
  const fecha = timestamp.toDate();
  const diffMin = Math.round((Date.now() - fecha.getTime()) / 60000);
  if(diffMin < 1) return "ahora";
  if(diffMin < 60) return `hace ${diffMin} min`;
  const diffH = Math.round(diffMin/60);
  if(diffH < 24) return `hace ${diffH} h`;
  const diffD = Math.round(diffH/24);
  return `hace ${diffD} día${diffD===1?'':'s'}`;
}

  const buscadorHtml = `

    </div>`;

  let contenido;
  if(vista === "cliente"){
    const grupos = {};
    state.equipos.filter(coincide).forEach(eq=>{
      const key = (eq.cliente||"").trim() || "__sin_cliente__";
      if(!grupos[key]) grupos[key] = { nombre: key==="__sin_cliente__" ? "Sin cliente asignado" : eq.cliente, telefono:"", direccion:"", equipos:[] };
      if(!grupos[key].telefono && eq.telefono) grupos[key].telefono = eq.telefono;
      if(!grupos[key].direccion && eq.direccion) grupos[key].direccion = eq.direccion;
      grupos[key].equipos.push(eq);
    });
    const listaGrupos = Object.values(grupos).sort((a,b)=> a.nombre==="Sin cliente asignado" ? 1 : b.nombre==="Sin cliente asignado" ? -1 : a.nombre.localeCompare(b.nombre));

    contenido = listaGrupos.length ? `<div class="grid-cards">${listaGrupos.map(g=>{
      const tieneTelefono = !!limpiarTelefono(g.telefono);
      return `
      <div class="card">
        <div style="font-weight:700; font-size:14.5px;">${g.nombre}</div>
        ${g.direccion ? `<div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">${g.direccion}</div>` : ""}
        ${tieneTelefono ? `
        <div style="display:flex; gap:8px; margin-top:10px;">
          <a href="tel:${limpiarTelefono(g.telefono)}" style="flex:1; text-decoration:none; display:flex; align-items:center; justify-content:center; gap:6px; background:var(--chip-bg); color:var(--primary); border-radius:10px; padding:8px; font-size:12px; font-weight:700;">${svg('phone',13,'var(--primary)')} Llamar</a>

        <div style="margin-top:12px; border-top:1px solid var(--line); padding-top:10px; display:flex; flex-direction:column; gap:8px;">
          ${g.equipos.map(eq=>`
            <button onclick="openEquipo(${eq.id})" style="background:var(--app-bg); border:none; border-radius:10px; padding:9px 10px; text-align:left; display:flex; justify-content:space-between; align-items:center; cursor:pointer;">

              </div>
              ${svg('chevronRight',15,'var(--ink-soft)')}
            </button>`).join("")}
        </div>
      </div>`;
    }).join("")}</div>` : `<div style="text-align:center; color:var(--ink-soft); font-size:13px; padding-top:40px;">Sin resultados.</div>`;
  } else {
    const equiposFiltrados = state.equipos.filter(coincide);
    const rows = equiposFiltrados.map(eq=>{
      const filtroSucio = estadoFiltro(eq).estado === "sucio";
      return `<a class="equipo-row" href="javascript:void(0)" onclick="openEquipo(${eq.id})">
        <div class="card" style="display:flex; gap:12px; margin-bottom:12px;">
          <div class="equipo-icon" style="padding:10px;"><img src="ac-unit.png" alt="" style="width:100%; height:100%; object-fit:contain;" /></div>
          <div style="flex:1;">
            <div style="font-weight:700; font-size:14.5px;">${eq.nombre}${eq.cliente ? ` · ${eq.cliente}` : ""}</div>
            <div style="font-size:12.5px; color:var(--ink-soft);">${eq.marca}</div>
            <div style="font-size:11.5px; color:var(--ink-soft); margin-top:4px;">Instalado: ${eq.instalado}</div>
            <div style="font-size:11.5px; color:var(--ink-soft);">Último mantenimiento: ${eq.ultimo || "Aún sin mantenimiento"}</div>
            <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
              <div class="chip">${eq.proximo ? `Próximo: ${eq.proximo}` : "Sin mantenimiento programado"}</div>
              ${filtroSucio ? `<div class="chip chip-warn">Filtro sucio</div>` : ""}
            </div>
          </div>
          <div style="align-self:center;">${svg('chevronRight',18,'var(--ink-soft)')}</div>
        </div>
      </a>`;
    }).join("");
    contenido = equiposFiltrados.length ? `<div class="grid-cards">${rows}</div>` : `<div style="text-align:center; color:var(--ink-soft); font-size:13px; padding-top:40px;">Sin resultados.</div>`;
  }

  return `
    <div class="screen">
      ${topBar("Mis Equipos","home", `<div style="display:flex; gap:6px;"><button class="iconbtn" onclick="go('agenda')">${svg('calendarDays',20,'var(--ink)')}</button><button class="iconbtn" onclick="go('agregarEquipo')">${svg('plus',22,'var(--ink)')}</button></div>`)}
      <div class="scroll">
        ${toggleBar}
        ${buscadorHtml}
        ${contenido}
      </div>
      ${bottomNav("equipos")}
    </div>`;

function recalcularFechasEquipo(eq){
  const pendientes = eq.historial.filter(h=>!h.realizado);
  const realizados = eq.historial.filter(h=>h.realizado);

  eq.proximo = pendientes.length
    ? pendientes.reduce((min,h)=> parseDMY(h.fecha) < parseDMY(min) ? h.fecha : min, pendientes[0].fecha)
    : null;

  eq.ultimo = realizados.length
    ? realizados.reduce((max,h)=> parseDMY(h.fecha) > parseDMY(max) ? h.fecha : max, realizados[0].fecha)
    : null;
}

const MESES_ES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const DIAS_SEMANA_ES = ["D","L","M","M","J","V","S"];
const DIAS_SEMANA_LARGO_ES = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];

function isoHoy(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function eventosPorFecha(){
  const mapa = {};
  state.equipos.forEach(eq=>{
    (eq.historial||[]).forEach(h=>{
      const iso = fechaDMYaISO(h.fecha);
      if(!mapa[iso]) mapa[iso] = [];
      mapa[iso].push({
        equipoId: eq.id,
        historialId: h.id,
        nombre: eq.nombre,
        cliente: eq.cliente,
        marca: eq.marca,
        telefono: eq.telefono,
        fecha: h.fecha,
        tipo: h.tipo,
        hora: h.hora || "",
        precio: h.precio,
        notas: h.notas,
        realizado: !!h.realizado
      });
    });
  });
  Object.values(mapa).forEach(arr=>arr.sort((a,b)=>(a.hora||"99:99") < (b.hora||"99:99") ? -1 : 1));
  return mapa;
}

function marcarRealizadoAgenda(equipoId, historialId){
  const eq = state.equipos.find(e=>e.id===Number(equipoId));
  if(!eq) return;
  const h = eq.historial.find(x=>String(x.id)===String(historialId));
  if(!h) return;
  h.realizado = true;
  recalcularFechasEquipo(eq);
  saveEquipos(state.equipos);
  showToast("Marcado como realizado");
  render();
}

  if(!nuevaFechaISO){ showToast("Elige una fecha"); return; }
  h.fecha = fechaISOaDMY(nuevaFechaISO);
  h.hora = nuevaHora || "";
  recalcularFechasEquipo(eq);
  saveEquipos(state.equipos);
  state.agendaReagendando = null;
  showToast("Reagendado");
  render();
}

function generarCeldasCalendario(year, month){
  const primerDia = new Date(year, month, 1);
  const startWeekday = primerDia.getDay();
  const diasEnMes = new Date(year, month+1, 0).getDate();
  const celdas = [];
  for(let i=0;i<startWeekday;i++) celdas.push(null);
  for(let d=1; d<=diasEnMes; d++){
    celdas.push({ day:d, iso:`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}` });
  }
  while(celdas.length % 7 !== 0) celdas.push(null);
  return celdas;
}

function cambiarMesAgenda(delta){
  let m = state.agendaMonth + delta;
  let y = state.agendaYear;
  if(m < 0){ m = 11; y--; }
  if(m > 11){ m = 0; y++; }
  state.agendaMonth = m;
  state.agendaYear = y;
  render();
}

  const hoyIso = isoHoy();
  if(!state.agendaYear){ const d = new Date(); state.agendaYear = d.getFullYear(); state.agendaMonth = d.getMonth(); }

  const celdasHtml = celdas.map(c=>{
    if(!c) return `<div></div>`;
    const eventos = mapa[c.iso] || [];
    const tienePendientes = eventos.some(e=>!e.realizado);

    const esHoy = c.iso === hoyIso;
    const esSel = c.iso === state.agendaDiaSel;
    let bg = "transparent", color = "var(--ink)";

  const [selY, selM, selD] = state.agendaDiaSel.split("-").map(Number);
  const selDate = new Date(selY, selM-1, selD);
  const nombreDiaSel = `${DIAS_SEMANA_LARGO_ES[selDate.getDay()]} ${selD} de ${MESES_ES[selM-1].toLowerCase()}`;

          <button class="btn-outline" style="flex:1; padding:9px 0; font-size:12.5px;" onclick="cancelarReagendarAgenda()">CANCELAR</button>
        </div>
      </div>`;
    }

    return `
    <div class="card" style="margin-bottom:10px;">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; cursor:pointer;" onclick="openEquipo(${ev.equipoId})">

          <div style="font-weight:700; font-size:14px;">${ev.nombre}${ev.cliente ? ` · ${ev.cliente}` : ""}</div>
          <div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">${ev.marca}${ev.hora ? ` · ${ev.hora}` : ""}</div>

function screenHistorial(){

  const rows = filtered.map(h=>`
    <div class="card" style="display:flex; gap:10px; margin-bottom:10px; cursor:pointer;" onclick="verEquipoDesdeHistorial(${h.equipoId})">
      ${h.realizado ? svg('check',20,'#28A88B') : svg('calendarDays',20,'var(--warn)')}

        <div style="display:flex; justify-content:space-between; align-items:center;">

          <div style="display:flex; align-items:center; gap:10px;">
            <button class="iconbtn" style="padding:2px; margin:-2px;" onclick="event.stopPropagation(); editarHistorialItem('${h.equipoId}','${h.id}')">${svg('edit',16,'var(--primary)')}</button>
            <button class="iconbtn" style="padding:2px; margin:-2px;" onclick="event.stopPropagation(); eliminarHistorialItem('${h.equipoId}','${h.id}')">${svg('trash',16,'#D64545')}</button>
            ${svg('chevronRight',16,'var(--ink-soft)')}
          </div>
        </div>
        <div style="font-size:12px; color:var(--primary); font-weight:700; margin-top:2px;">${h.equipo} · ${h.tipo}${(h.precio!==undefined && h.precio!==null) ? ` · $${Number(h.precio).toFixed(2)}` : ""} ${h.realizado ? '' : '· <span style="color:var(--warn);">Pendiente</span>'}</div>
        <div style="font-size:12px; color:var(--ink-soft); margin-top:4px;">Técnico: ${h.tecnico}</div>
        <div style="font-size:12px; color:var(--ink-soft); margin-top:2px;">Notas: ${h.notas}</div>
        ${h.realizado ? `<button onclick="event.stopPropagation(); verComprobante('${h.equipoId}','${h.id}')" style="margin-top:8px; background:var(--chip-bg); color:var(--primary); border:none; border-radius:8px; padding:7px 10px; font-size:11.5px; font-weight:700; cursor:pointer;">${svg('cash',12,'var(--primary)')} Ver comprobante</button>` : ""}

    state.equipos.map(eq=>`<option value="${eq.id}" ${filtro===eq.id?'selected':''}>${eq.nombre}</option>`).join("");

  const filtroBar = all.length ? `
    <div style="padding:0 20px 12px;">
      <select class="field-input" style="margin-top:0;" onchange="cambiarFiltroHistorial(this.value)">

        <div style="display:flex; flex-direction:column; align-items:center; text-align:center; padding-top:60px;">

function guardarEdicionHistorial(){
  const eq = state.equipos.find(e=>e.id===state.equipoSelId);
  if(!eq) return;
  const h = eq.historial.find(x=>String(x.id)===String(state.historialEditId));
  if(!h) return;

  const fechaISO = document.getElementById("eh-fecha").value;
  const hora = document.getElementById("eh-hora").value;
  const tipo = document.getElementById("eh-tipo").value;
  const tecnico = document.getElementById("eh-tecnico").value.trim();
  const precioRaw = document.getElementById("eh-precio").value;
  const notas = document.getElementById("eh-notas").value.trim();
  const realizado = document.getElementById("eh-realizado").checked;

  if(fechaISO) h.fecha = fechaISOaDMY(fechaISO);
  h.hora = hora || "";
  h.tipo = tipo;
  h.tecnico = tecnico || "Sin asignar";
  h.precio = precioRaw ? Number(precioRaw) : null;
  h.notas = notas || "Sin notas.";
  h.realizado = realizado;

  recalcularFechasEquipo(eq);
  saveEquipos(state.equipos);
  showToast("Registro actualizado");
  go("historial");
}

function verComprobante(equipoId, historialId){
  state.comprobanteEquipoId = Number(equipoId);

  go("comprobante");
}

function datosComprobante(){
  const eq = state.equipos.find(e=>e.id===state.comprobanteEquipoId);
  const h = eq ? eq.historial.find(x=>String(x.id)===String(state.comprobanteHistorialId)) : null;
  return { eq, h };
}

function textoComprobante(eq, h){
  const negocioNombre = state.perfil.negocioNombre || "AiresCare";
  const lineas = [
    `${negocioNombre} · Comprobante de servicio`,
    ``,
    `Cliente: ${eq.cliente || "-"}`,
    `Equipo: ${eq.nombre}${eq.marca && eq.marca!=='Sin especificar' ? ' - '+eq.marca : ''}`,
    `Fecha: ${h.fecha}${h.hora ? ' · '+h.hora : ''}`,
    `Servicio: ${h.tipo}`,
    `Técnico: ${h.tecnico}`,
  ];
  if(h.precio!==undefined && h.precio!==null) lineas.push(`Precio: $${Number(h.precio).toFixed(2)}`);
  if(h.notas && h.notas!=='Sin notas.') lineas.push(`Notas: ${h.notas}`);
  lineas.push(``, `¡Gracias por confiar en nosotros!`);
  return lineas.join("\n");
}

function enviarComprobanteWhatsApp(){
  const { eq, h } = datosComprobante();
  if(!eq || !h) return;
  const texto = textoComprobante(eq, h);
  window.open(linkWhatsApp(eq.telefono, texto), "_blank", "noopener");
}

function descargarComprobantePDF(){
  const { eq, h } = datosComprobante();
  if(!eq || !h) return;
  if(typeof window.jspdf === "undefined"){
    showToast("No se pudo cargar el generador de PDF");
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"pt", format:"a4" });
  const azul = [14,99,176];
  const gris = [91,122,147];
  const tinta = [11,42,69];
  const negocioNombre = state.perfil.negocioNombre || "AiresCare";
  const negocioLogo = state.perfil.negocioLogo;

  doc.setFillColor(...azul);
  doc.rect(0,0,595,90,"F");
  let textX = 40;
  if(negocioLogo){
    try{
      doc.addImage(negocioLogo, "JPEG", 40, 20, 50, 50);
      textX = 104;
    }catch(e){}
  }
  doc.setTextColor(255,255,255);
  doc.setFontSize(20);
  doc.setFont("helvetica","bold");
  doc.text(negocioNombre, textX, 45);
  doc.setFontSize(11);
  doc.setFont("helvetica","normal");
  doc.text("Comprobante de servicio de mantenimiento", textX, 65);

  let y = 130;
  doc.setTextColor(...tinta);
  doc.setFontSize(13);
  doc.setFont("helvetica","bold");
  doc.text(eq.cliente || "Cliente sin nombre", 40, y);
  y += 18;
  doc.setFontSize(10);
  doc.setFont("helvetica","normal");
  doc.setTextColor(...gris);
  if(eq.telefono) { doc.text(`Tel: ${eq.telefono}`, 40, y); y += 15; }
  if(eq.direccion) { doc.text(`Dirección: ${eq.direccion}`, 40, y); y += 15; }

  y += 15;
  doc.setDrawColor(220,234,243);
  doc.line(40, y, 555, y);
  y += 30;

  const filas = [
    ["Equipo", `${eq.nombre}${eq.marca && eq.marca!=='Sin especificar' ? ' - '+eq.marca : ''}`],
    ["Fecha", `${h.fecha}${h.hora ? ' · '+h.hora : ''}`],
    ["Tipo de servicio", h.tipo],
    ["Técnico", h.tecnico],
  ];
  if(h.precio!==undefined && h.precio!==null) filas.push(["Precio", `$${Number(h.precio).toFixed(2)}`]);
  filas.push(["Notas", (h.notas && h.notas!=='Sin notas.') ? h.notas : "-"]);

  filas.forEach(([label, val])=>{
    doc.setFont("helvetica","bold");
    doc.setTextColor(...tinta);
    doc.setFontSize(10.5);
    doc.text(label, 40, y);
    doc.setFont("helvetica","normal");
    doc.setTextColor(...gris);
    const texto = doc.splitTextToSize(String(val), 350);
    doc.text(texto, 200, y);
    y += 20 * texto.length;
  });

  y += 20;
  doc.setDrawColor(220,234,243);
  doc.line(40, y, 555, y);
  y += 25;
  doc.setFontSize(10);
  doc.setTextColor(...gris);
  doc.text(`¡Gracias por confiar en ${negocioNombre} para el mantenimiento de tus equipos!`, 40, y);

  const nombreArchivo = `comprobante-${(eq.cliente||eq.nombre).replace(/\s+/g,'_')}-${h.fecha.replace(/\//g,'-')}.pdf`;
  doc.save(nombreArchivo);
}

          <input type="file" id="pf-logo-camara" accept="image/*" capture="environment" style="display:none;" onchange="manejarFotoInput(this, 400, (url)=>{ state.perfil.negocioLogo = url; savePerfil(state.perfil); render(); })" />

function borrarTodo(){
  showConfirm("¿Borrar todos los equipos y su historial? Esta acción no se puede deshacer.", () => {
    state.equipos = [];
    saveEquipos(state.equipos);
    showToast("Datos borrados");
    go("home");
  });
}

function guardarPerfil(){
  const nombre = document.getElementById("pf-nombre").value.trim();
  const negocioNombre = document.getElementById("pf-negocio").value.trim();
  const correo = document.getElementById("pf-correo").value.trim();
  const telefono = document.getElementById("pf-telefono").value.trim();
  state.perfil = { ...state.perfil, nombre, negocioNombre, correo, telefono };
  savePerfil(state.perfil);
  showToast("Datos guardados");
  render();
}

/* ---------- Render principal ---------- */
function render(){
  const map = {
    cargando: screenCargando,
    login: screenLogin,
    notificaciones: screenNotificaciones,
    bloqueado: screenBloqueado,
    bienvenida: screenBienvenida,
    home: screenHome,
    equipos: screenEquipos,
    detalle: screenDetalle,
    agregarEquipo: screenAgregarEquipo,
    editarEquipo: screenEditarEquipo,
    agendar: screenAgendar,
    notificacion: screenNotificacion,
    historial: screenHistorial,
    editarHistorial: screenEditarHistorial,
    comprobante: screenComprobante,
    agenda: screenAgenda,
    consejos: screenConsejos,
    perfil: screenPerfil,
    adminPanel: screenAdminPanel
  };
  const fn = map[state.screen] || screenHome;
  document.getElementById("app").innerHTML = fn();
  updateSidebarActive();
  updateMobileTopbarProfile();
  updateCampanitas();
  initMapPickerIfNeeded();
}

function updateMobileTopbarProfile(){
  const btn = document.getElementById("mobileTopbarProfile");
  if(!btn) return;
  const isActive = state.screen === "perfil";
  btn.classList.toggle("active", isActive);
  const foto = state.perfil && (state.perfil.foto || (state.usuario && state.usuario.foto));
  if(foto){
    btn.innerHTML = `<img src="${foto}" style="width:100%; height:100%; object-fit:cover; border-radius:999px;" alt="" />`;
  } else {
    btn.innerHTML = svg("user", 17, isActive ? "var(--primary)" : "var(--ink-soft)");
  }
}

function updateCampanitas(){
  const n = state.notifNoLeidas || 0;
  const texto = n > 9 ? "9+" : String(n);
  [document.getElementById("mobileTopbarBellBadge"), document.getElementById("desktopTopbarBellBadge")].forEach(badge=>{
    if(!badge) return;
    if(n > 0){
      badge.style.display = "flex";
      badge.textContent = texto;
    } else {
      badge.style.display = "none";
    }
  });
}

function updateSidebarActive(){
  const group = {
    home:"home", notificacion:"home",
    equipos:"equipos", detalle:"equipos", agregarEquipo:"equipos", editarEquipo:"equipos", agendar:"equipos",
    agenda:"agenda",
    historial:"historial", editarHistorial:"historial", comprobante:"historial",
    consejos:"consejos",
    perfil:"perfil", adminPanel:"perfil"
  }[state.screen] || "home";
  document.querySelectorAll(".sidebar-link").forEach(btn=>{
    btn.classList.toggle("active", btn.getAttribute("data-screen")===group);
  });

  const esPantallaAuth = state.screen === "cargando" || state.screen === "login" || state.screen === "bienvenida" || state.screen === "bloqueado";
  const mobileTop = document.getElementById("mobileTopbar");
  const sidebarEl = document.getElementById("sidebar");
  if(mobileTop) mobileTop.style.display = esPantallaAuth ? "none" : "";
  if(sidebarEl) sidebarEl.style.display = esPantallaAuth ? "none" : "";
  const desktopTopRight = document.getElementById("desktopTopbarRight");
  if(desktopTopRight) desktopTopRight.style.display = esPantallaAuth ? "none" : "";

  const nombreMostrado = (state.perfil && state.perfil.negocioNombre) || "AiresCare";
  const spanMobile = document.getElementById("mobileTopbarNombre");
  const spanSidebar = document.getElementById("sidebarLogoNombre");
  if(spanMobile) spanMobile.textContent = nombreMostrado;
  if(spanSidebar) spanSidebar.textContent = nombreMostrado;

  const logoNegocio = state.perfil && state.perfil.negocioLogo;
  const logoMobile = document.getElementById("mobileTopbarLogoImg");
  const logoSidebar = document.getElementById("sidebarLogoImg");
  if(logoMobile) logoMobile.src = logoNegocio || "icon-192.png";
  if(logoSidebar) logoSidebar.src = logoNegocio || "icon-192.png";

  const desktopAvatarBtn = document.getElementById("desktopTopbarAvatar");
  if(desktopAvatarBtn){
    const foto = state.perfil && (state.perfil.foto || (state.usuario && state.usuario.foto));
    desktopAvatarBtn.innerHTML = foto
      ? `<img src="${foto}" style="width:100%; height:100%; object-fit:cover; border-radius:999px;" alt="" />`
      : svg("user", 17, "var(--ink-soft)");
  }
}
render();
history.replaceState({screen: state.screen}, "", "");

window.addEventListener("popstate", (e) => {
  const targetScreen = (e.state && e.state.screen) ? e.state.screen : "home";
  state.screen = targetScreen;
  render();
  document.querySelector(".scroll") && (document.querySelector(".scroll").scrollTop = 0);
});

/* ---------- Service worker + instalación ---------- */
let swRegistration = null;
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js")
      .then(reg=>{ swRegistration = reg; })
      .catch(()=>{});
  });
}

let deferredPrompt = null;
window.addEventListener("beforeinstallprompt", (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("installBanner").style.display = "flex";
});
document.getElementById("installBtn").addEventListener("click", async ()=>{
  document.getElementById("installBanner").style.display = "none";
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  }
});
window.addEventListener("appinstalled", ()=>{
  document.getElementById("installBanner").style.display = "none";
});

/* ---------- Notificaciones de mantenimiento ---------- */
function notificacionesSoportadas(){
  return "Notification" in window;
}

function pedirPermisoNotificaciones(){
  if(!notificacionesSoportadas()){
    showToast("Tu navegador no soporta notificaciones");
    return;
  }
  Notification.requestPermission().then(perm=>{
    if(perm==="granted"){
      showToast("Notificaciones activadas");
      revisarMantenimientosProximos(true);
      registrarTokenFCM();
    } else if(perm==="denied"){
      showToast("Notificaciones bloqueadas por el navegador");
    }
    render();
  });
}

async function registrarTokenFCM(mostrarAviso){
  if(!messaging){
    if(mostrarAviso) showToast("Este navegador no soporta notificaciones push");
    return;
  }
  if(!state.usuario || Notification.permission !== "granted") return;
  try{
    const registration = await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
    if(token){
      await db.collection("usuarios").doc(state.usuario.uid).collection("tokens").doc(token).set({
        token,
        creado: firebase.firestore.FieldValue.serverTimestamp(),
        userAgent: navigator.userAgent
      });
      if(mostrarAviso) showToast("Dispositivo registrado para notificaciones push ✓");
    } else if(mostrarAviso){
      showToast("No se obtuvo un token de notificaciones");
    }
  }catch(e){
    console.error("No se pudo registrar el token de notificaciones push:", e);
    if(mostrarAviso) showToast("Error: " + (e.message || e.code || "no se pudo registrar"));
  }
}

function enviarNotificacion(title, body, tagKey){
  const opts = {
    body,
    icon: "icon-192.png",
    badge: "icon-192.png",
    tag: tagKey,
    renotify: false
  };
  if(swRegistration && swRegistration.showNotification){
    swRegistration.showNotification(title, opts).catch(()=>{
      try{ new Notification(title, opts); }catch(e){}
    });
  } else {
    try{ new Notification(title, opts); }catch(e){}
  }
}

// Revisa todos los equipos y notifica los que tengan mantenimiento vencido, hoy o mañana.
// forzar=true ignora el registro de "ya notificado" (util justo despues de activar permisos).
// NOTA: el aviso local automático quedó desactivado a propósito. Ahora todos
// los avisos de mantenimiento los manda el robot de GitHub Actions (mismo
// aviso, pero sin duplicarlo). Esta función se deja definida por si se
// necesita reactivar, pero ya no se llama sola.
function revisarMantenimientosProximos(forzar){
  if(!notificacionesSoportadas() || Notification.permission !== "granted") return;
  const log = forzar ? [] : loadNotifLog();
  let changed = false;

  state.equipos.forEach(eq=>{
    if(!eq.proximo) return;
    const dias = diasRestantes(eq.proximo);
    if(dias > 1) return; // solo avisar si es hoy, manana, o ya se vencio

    const key = `${eq.id}_${eq.proximo}`;
    if(log.includes(key)) return;

    let mensaje;
    if(dias === 0) mensaje = `El mantenimiento de "${eq.nombre}" es hoy.`;
    else if(dias === 1) mensaje = `El mantenimiento de "${eq.nombre}" es mañana.`;
    else mensaje = `El mantenimiento de "${eq.nombre}" venció hace ${Math.abs(dias)} día${Math.abs(dias)===1?'':'s'}.`;

    // enviarNotificacion("AiresCare · Recordatorio", mensaje, key); // desactivado: lo manda el robot
    log.push(key);
    changed = true;
  });

  if(changed) saveNotifLog(log);
}

// Ya no se revisa sola al abrir/volver a la app ni cada 30 min (ver nota arriba).
setInterval(()=>cargarNotificaciones(), 5*60*1000);
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible") cargarNotificaciones();
});

// Sincronizar con la nube al abrir la app
sincronizarDesdeNube();
