name: Mobile build (VetData)

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-build.yml"
      - "index.html"
      - "manifest.json"
      - "sw.js"
      - "icon-192.png"
      - "icon-512.png"
  workflow_dispatch:

jobs:
  android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install npm dependencies
        run: npm install

      - name: Copiar la web real (raíz del repo) a mobile/www
        run: cp ../index.html ../manifest.json ../sw.js ../icon-192.png ../icon-512.png www/

      - name: Escribir version.json con el número de build (para detectar actualizaciones dentro de la app)
        run: |
          echo "{\"buildNumber\": ${{ github.run_number }}}" > www/version.json

      - name: Sync Capacitor (copy web assets into native project)
        run: npx cap sync android

      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Verificar huella SHA-1 con la que quedó firmado el APK
        working-directory: mobile/android
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "Usando build-tools en: $BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Renombrar el APK a algo reconocible (app-debug.apk es el nombre genérico de Android)
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/vetdata.apk

      - name: Upload APK (artifact interno de este run)
        uses: actions/upload-artifact@v4
        with:
          name: vetdata-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/vetdata.apk

      - name: Publicar el APK como GitHub Release (descargable desde el celular)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android/app/build/outputs/apk/debug/vetdata.apk
          TAG=mobile-debug-latest
          # El "[build N]" al final NO es decorativo: la app, ya instalada,
          # lo lee de las notas de esta misma publicación para saber si hay
          # una versión más nueva que la que tiene instalada (compara contra
          # el build number que ella misma guardó al compilarse — ver
          # version.json más arriba y el useEffect de "actualizacionDisponible"
          # en index.html). Si se cambia este formato, hay que actualizar
          # también esa expresión regular en index.html.
          NOTES="APK de prueba (debug, sin firmar para producción) generado automáticamente desde la rama ${{ github.ref_name }}, commit ${{ github.sha }}. [build ${{ github.run_number }}]"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Borra el archivo con el nombre viejo (app-debug.apk), de cuando
            # todavía no se renombraba, para que no queden dos archivos
            # confundiendo cuál descargar.
            gh release delete-asset "$TAG" app-debug.apk --repo "${{ github.repository }}" --yes || true
            gh release upload "$TAG" "$APK" --clobber --repo "${{ github.repository }}"
            gh release edit "$TAG" --notes "$NOTES" --repo "${{ github.repository }}"
          else
            gh release create "$TAG" "$APK" \
              --title "VetData - APK de prueba (debug)" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}"
          fi

  ios:
    name: Build iOS project (simulator, sin firma)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: Copiar la web real (raíz del repo) a mobile/www
        run: cp ../index.html ../manifest.json ../sw.js ../icon-192.png ../icon-512.png www/

      - name: Sync Capacitor (copy web assets into native project)
        run: npx cap sync ios

      - name: Build for iOS Simulator (sin firma, solo para validar que compila)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug build \
            CODE_SIGNING_ALLOWED=NO
