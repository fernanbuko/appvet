name: Revisar citas próximas y enviar notificaciones

on:
  schedule:
    # Cada 30 minutos. GitHub Actions usa hora UTC, pero esto no afecta el
    # resultado: el script calcula "cuánto falta para la cita" comparando
    # fechas completas, no solo la hora del reloj del robot.
    #
    # Coincide justo con MINUTOS_VENTANA (30) en revisar-citas.js: cada
    # cita con hora exacta cae dentro de esa ventana en alguna de las
    # corridas, así que no se pierde ningún aviso — solo llega, en el peor
    # caso, hasta 30 minutos antes en vez de poder avisar antes.
    #
    # Aviso honesto: GitHub NO garantiza que se ejecute exactamente al
    # minuto — en momentos de mucha carga en sus servidores (poco común,
    # pero puede pasar) a veces se retrasa unos minutos más.
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite ejecutarlo a mano desde la pestaña Actions, para probar

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: npm install firebase-admin
        working-directory: notificaciones-robot

      - name: Ejecutar la revisión de citas
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: node revisar-citas.js
        working-directory: notificaciones-robot
